name: Verificação

on:
  push:
  pull_request:

jobs:
  exemplos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q regressoes classificacao-knn classificadores-de-credito
      - run: python regressoes/exemplo.py
      - run: python classificacao-knn/exemplo.py
      - run: python classificadores-de-credito/exemplo.py
