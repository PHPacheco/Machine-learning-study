name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools regressoes/exemplo.py classificacao-knn/exemplo.py classificadores-de-credito/exemplo.py
      - run: ruff format --check src tests tools regressoes/exemplo.py classificacao-knn/exemplo.py classificadores-de-credito/exemplo.py
      - run: python -m pytest
      - run: python tools/check_notebooks.py
      - run: python tools/execute_smoke_notebook.py
      - name: Smoke test kNN
        run: python classificacao-knn/exemplo.py
