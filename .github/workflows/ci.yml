name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools 2_kNN/*.py 3_NaiveBayes/Parte1/pre_processamento_credito.py 3_NaiveBayes/Parte2/naive_bayes_pt2.py 3_NaiveBayes/Parte3/*.py
      - run: ruff format --check src tests tools 2_kNN/*.py 3_NaiveBayes/Parte1/pre_processamento_credito.py 3_NaiveBayes/Parte2/naive_bayes_pt2.py 3_NaiveBayes/Parte3/*.py
      - run: python -m pytest
      - run: python tools/check_notebooks.py
      - run: python tools/execute_smoke_notebook.py
      - name: Smoke test kNN
        run: python 2_kNN/demoD1.py
