[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aprendizado-de-maquina-estudos"
version = "0.1.0"
description = "Coleção acadêmica de estudos de aprendizado de máquina"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<1.9",
  "scipy>=1.12,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "nbclient>=0.10,<1",
  "plotly>=5.24,<7",
]
tensorflow = [
  "scikeras>=0.13,<1",
  "tensorflow>=2.16,<2.19",
]
pytorch = [
  "skorch>=1.0,<2",
  "torch>=2.3,<3",
  "torchinfo>=1.8,<2",
]
dev = [
  "pytest>=8.2,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
